name: iOS App CI

on: workflow_dispatch:

jobs: build: runs-on: macos-latest

steps:
- name: Checkout code
  uses: actions/checkout@v4
  with:
    submodules: recursive  # Checkout submodules recursively

- name: Verify project.pbxproj integrity
  run: |
    python -c "import plistlib; plistlib.load(open('RSDKv5.xcodeproj/project.pbxproj', 'rb'))"

- name: Fix project.pbxproj line endings
  run: |
    brew install dos2unix
    dos2unix RSDKv5.xcodeproj/project.pbxproj

- name: Install dependencies
  run: |
    brew install ldid
    gem install cocoapods
    pod install --repo-update || true  # Run CocoaPods install if applicable

- name: Resolve Swift Package Dependencies
  run: |
    xcodebuild -resolvePackageDependencies

- name: Update deployment target
  run: |
    find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' {} +

- name: Build the app for simulator
  run: |
    xcodebuild -project RSDKv5.xcodeproj \
               -scheme RSDKv5 \
               -sdk iphonesimulator \
               -destination 'platform=iOS Simulator,name=iPhone 12' \
               -configuration Release \
               clean build \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGNING_ALLOWED=NO \
               AD_HOC_CODE_SIGNING_ALLOWED=YES

- name: Run tests
  run: |
    xcodebuild test -project RSDKv5.xcodeproj \
               -scheme RSDKv5 \
               -sdk iphonesimulator \
               -destination 'platform=iOS Simulator,name=iPhone 12' \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGNING_ALLOWED=NO \
               AD_HOC_CODE_SIGNING_ALLOWED=YES

- name: Build for device
  run: |
    xcodebuild -project RSDKv5.xcodeproj \
               -scheme RSDKv5 \
               -sdk iphoneos \
               -configuration Release \
               clean build \
               CODE_SIGNING_REQUIRED=NO \
               CODE_SIGNING_ALLOWED=NO \
               AD_HOC_CODE_SIGNING_ALLOWED=YES \
               DEVELOPMENT_TEAM=XYZ0123456 \
               ORG_IDENTIFIER=com.SideStore \
               DWARF_DSYM_FOLDER_PATH="build/Release-iphoneos"

- name: Fakesign app
  run: ldid -S build/Release-iphoneos/RSDKv5.app/RSDKv5

- name: Convert to IPA
  run: |
    mkdir -p Payload
    cp -r build/Release-iphoneos/RSDKv5.app Payload/
    zip -r RSDKv5.ipa Payload

- name: Upload IPA Artifact
  uses: actions/upload-artifact@v4
  with:
    name: RSDKv5.ipa
    path: RSDKv5.ipa

